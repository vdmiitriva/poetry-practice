[project]
name = "poetry-practice"
version = "0.1.0"
description = ""
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cachetools (>=7.1.8,<8.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "google-api-core (>=2.36.0,<3.0.0)",
    "google-api-python-client (>=2.200.0,<3.0.0)",
    "google-auth (>=2.57.1,<3.0.0)",
    "google-auth-httplib2 (>=0.4.2,<0.5.0)",
    "googleapis-common-protos (>=1.75.3,<2.0.0)",
    "isodate (>=0.7.2,<0.8.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mccabe (>=0.7.0,<0.8.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "mypy-extensions (>=1.1.0,<2.0.0)",
    "packaging (>=26.3,<27.0)",
    "pathspec (>=1.1.1,<2.0.0)",
    "platformdirs (>=4.11.7,<5.0.0)",
    "protobuf (>=7.36.1,<8.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "requests (>=2.34.2,<3.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''
target-version = ["py314"]

[tool.isort]
# максимальная длина строки
line_length = 119

